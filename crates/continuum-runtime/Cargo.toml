[package]
name = "continuum-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
continuum-artifact = { path = "../continuum-artifact" }
# Task 4 起：`main.rs` 的装配处注册 `p3_capability_migrations()`（`tool` 表由用它的
# 那个 task 注册）。Task 7 接强制点 (2) 时另会用到它的类型。
continuum-capability = { path = "../continuum-capability" }
continuum-core = { path = "../continuum-core" }
continuum-effect = { path = "../continuum-effect" }
continuum-events = { path = "../continuum-events" }
continuum-graph = { path = "../continuum-graph" }
# Task 5（P3 子项目 D）起：`main.rs` 的装配处注册 `p3d_model_migrations()`
# （三张模型表由用它的那个 task 注册）。
continuum-model-registry = { path = "../continuum-model-registry" }
continuum-persist = { path = "../continuum-persist" }
# Task 10 起：第 7 步的集成路径要查策略（`load_policies`）并按裁决决定是否铸造批准值
# （`decide` / `PolicyContext` / `ExplicitApproval`）。
continuum-policy = { path = "../continuum-policy" }
continuum-provider = { path = "../continuum-provider" }
continuum-sandbox = { path = "../continuum-sandbox" }
# Task 7：`main.rs` 的装配处构造并持有密钥运行时（`src/secrets.rs` 的 `assemble`）。
# 装配是为将来的消费者做的：装配出的那个运行时今天**没有真消费者**（唯一候选是 B 的
# 连接器入口，按裁决 §七.3 不接），按使用是零消费者——见 `src/main.rs:32-37` 与 §八.2。
continuum-secrets = { path = "../continuum-secrets" }
continuum-workspace = { path = "../continuum-workspace" }
# Task 10 起：`task_cmd` 要构造第 2 级（`ExplicitCurrent`）那条内建规则，而 `Policy` 的
# `condition` 只能经 `Condition::parse(&serde_json::Value)` 造出——`continuum-policy`
# 不提供别的构造入口，故驱动取用它。
serde_json = { workspace = true }
# F 的 Task 3 起**第一次真的用上它**（此前 `src/` 与 `tests/` 对它零引用，`grep` 只命中
# 这一行）：`tool_call::run_tool_call` 要用 `block_on` 跑异步的
# `ProviderRegistry::invoke_tool`（其内层是 `async_trait` 的 `ToolProvider::invoke`）。
# 用当前线程运行时，**不 `enable_all`**——workspace 的 features 是
# `["rt-multi-thread", "macros"]`，`enable_all` 按 `net` / `time` 等 feature 门控，
# 换 feature 会动这份依赖清单（F 设计 §10.1 记的正是这一条）。
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# ─────────────────────────────────────────────────────────────────────────────
# `async-trait`：**这条边 F 与 G 各加过一次**，合入时按「同一条边、一个键」收口
# （2026-10-09，合 `p3g` 到 `main`）。两侧的理由都留，**行只留一行**。
# 下面两段注释分别记的是两个使用者，不是两次登记。
#
# **F 的 Task 3 起的使用点**：库级用例（`tests/tool_call.rs`）的夹具适配器要 `impl ToolProvider`，
# 而那个 trait 是 `#[async_trait]` 的。**它是外部 crate**，故内部边表
# （`tests/dependency_direction.rs` 的 `ALLOWED`）不受影响（F 设计 §10.1：「不新增 crate
# 边」的射程是那张内部边表，不是本文件的全部）。
# **订正（F 的 Task 3 实测）**：本行先前照设计写成「与 `Cargo.lock` 都不受影响」——
# **那半句是假的**：锁文件记的是**每个包的依赖清单**，与那条边是内部还是外部无关；
# 加这条 dev 边之后，`Cargo.lock` 的 `continuum-runtime` 条目实测多出一行 `async-trait`。
# 本 task 把 `Cargo.lock` 一并提交（不提交它，仓库里的锁就是过期的）。
# 错误说法的来历留此：设计 §10.1 的原句是「它是**外部** crate，故 `ALLOWED`（内部边表）
# 与 `Cargo.lock` 都不受影响」——前半句成立，后半句不成立。
#
# **G 的 Task 2 起的使用点**：`tests/common/mod.rs` 的假模型适配器要**实现** `ModelProvider`，
# 而它是 `#[async_trait]` 的 trait——实现侧必须同法标注。
# **F 的 Task 2 也会加它**：两处是同一条边的两个使用者，谁先落地谁登记，不是重复登记。
# **外部 crate 不进 `ALLOWED`**——那张表只逐对断言 workspace 成员之间的边
# （设计 §10），与 provider Cargo.toml 的 `thiserror` / `trybuild` 两条同理。
async-trait = { workspace = true }
# Task 2 起的使用点：`OnceStream` 要 `Stream` trait 与 `Pin`。
# **不用 `futures-util`**——`stream::iter` 在它里面，本仓不引它；判据见
# `crates/continuum-provider/tests/common/mod.rs:31-32` 的同一句话（同一取舍的第二份副本）。
futures-core = { workspace = true }
