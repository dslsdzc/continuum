[package]
name = "continuum-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
continuum-artifact = { path = "../continuum-artifact" }
# Task 4 起：`main.rs` 的装配处注册 `p3_capability_migrations()`（`tool` 表由用它的
# 那个 task 注册）。Task 7 接强制点 (2) 时另会用到它的类型。
continuum-capability = { path = "../continuum-capability" }
continuum-core = { path = "../continuum-core" }
continuum-effect = { path = "../continuum-effect" }
continuum-events = { path = "../continuum-events" }
continuum-graph = { path = "../continuum-graph" }
continuum-persist = { path = "../continuum-persist" }
# Task 10 起：第 7 步的集成路径要查策略（`load_policies`）并按裁决决定是否铸造批准值
# （`decide` / `PolicyContext` / `ExplicitApproval`）。
continuum-policy = { path = "../continuum-policy" }
continuum-provider = { path = "../continuum-provider" }
continuum-sandbox = { path = "../continuum-sandbox" }
# Task 7：`main.rs` 的装配处构造并持有密钥运行时（`src/secrets.rs` 的 `assemble`）。
# 装配是为将来的消费者做的：装配出的那个运行时今天**没有真消费者**（唯一候选是 B 的
# 连接器入口，按裁决 §七.3 不接），按使用是零消费者——见 `src/main.rs:32-37` 与 §八.2。
continuum-secrets = { path = "../continuum-secrets" }
continuum-workspace = { path = "../continuum-workspace" }
# Task 10 起：`task_cmd` 要构造第 2 级（`ExplicitCurrent`）那条内建规则，而 `Policy` 的
# `condition` 只能经 `Condition::parse(&serde_json::Value)` 造出——`continuum-policy`
# 不提供别的构造入口，故驱动取用它。
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
