[package]
name = "continuum-capability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Task 3 起的使用点：`tool.rs` 复用 `continuum_core::tool::ToolId`（§252 的 `Tool.id`，
# §316 的 ToolProvider 接口类型）。**不在本 crate 另建第二个 `ToolId`**——同一件事两个
# 类型正是本项目一贯判为缺陷的那一类（设计 §3.1）。
continuum-core = { path = "../continuum-core" }
# Task 1 起的使用点：`capability.rs` 的 `CapabilityKind::for_effect` 取 `EffectType`；
# Task 3 起 `tool.rs` 的 `Tool.effect_class` 也取它（设计 §3.2：不发明第二套分类）。
continuum-effect = { path = "../continuum-effect" }
# Task 3 起的使用点：`tool.rs` 的 `Tool` 两个 schema 字段取 `serde_json::Value`。
# 本 crate 不在自己的类型上派生 serde，故不列 serde。Task 4 起 `persist.rs` 另用
# 它做 `required_capabilities` 的**容器**编码（JSON 字符串数组），元素编码仍取自
# `CapabilityKind::as_str`，不经 serde。
serde_json = { workspace = true }
# 本 task 的使用点：`error.rs` 的 `CapabilityError` 派生 `thiserror::Error`。
thiserror = { workspace = true }
# Task 4 起的使用点：`persist.rs` 的 `tool` 表迁移与行级读写经 `Tx` / `Migration` /
# `PersistError` / `Value` 访问（设计 §3.3、§7）。数据库连接在 `continuum-persist`
# 内私有，本 crate 只经 `Tx` 访问。
continuum-persist = { path = "../continuum-persist" }

[dev-dependencies]
# 本 task 的使用点：`tests/type_level.rs` 用编译失败样例钉住「不可构造 / 不可与裸
# 字符串互换」（设计 §2.3 第三条、第 8 节）。与 continuum-workspace 的用法同形。
trybuild = { workspace = true }
# Task 4 起的使用点：`tests/persist.rs` 的落库用例各起一个临时库。
tempfile = { workspace = true }

# 其余依赖由需要它们的 task 增量加（设计第 6 节的边表是允许集合，不是一次性声明清单；
# 叶子 crate 的条目记实际依赖，同理见 continuum-policy 的 Cargo.toml）：
# continuum-events（`AuditKind::CapabilityGrants`，Task 5 的 `authorize`）。
