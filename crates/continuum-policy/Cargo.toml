[package]
name = "continuum-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
continuum-artifact = { path = "../continuum-artifact" }
# 无 continuum-core：本 crate 对它的引用为零，而叶子 crate 的条目记实际依赖（设计下篇
# 第 3 节）。设计第 3 节的依赖方向图曾列过这条边，按该口径它是假边，故不声明。
