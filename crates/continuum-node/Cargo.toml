[package]
name = "continuum-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# 本 crate 的使用点：`placement.rs` 的 `PlacementRequest` 装 `Artifact`，
# `TransferRule` 的判据面与 `PlacementRules` 的键取 `PrivacyClass`（设计 §7.2 的唯一一条边）。
# 两个都是**既有类型**，本 crate 一个都不新建。
continuum-artifact = { path = "../continuum-artifact" }
# 本 crate 的使用点：`error.rs` 的 `RulesError` / `PlacementError` 与 `registry.rs` 的
# `NodeRegistryError`，三处都派生 `thiserror::Error`。
# **旧话照留（它错在哪）**：本行此前只列 `error.rs` 两处——它落笔于 Task 1，
# 而 Task 3 把注册表的错误类型搬进 `registry.rs` 时没有同步这一行
# （订正于 2026-10-07 的 P3-E 终审修复轮）。
thiserror = { workspace = true }

[dev-dependencies]
# Task 2 起的使用点：`tests/type_level.rs` 用编译失败样例钉住「crate 外写不出 `ComputeNode`
# 的字段字面量」（设计 §3.5、§9）。与 continuum-model-registry 的用法同形。
# **它是外部 crate，不进 `dependency_direction.rs` 的 `ALLOWED`**——那张表只断言 workspace
# 成员之间的边（设计 §7.3）。
trybuild = { workspace = true }
# Task 5 起的使用点：`tests/placement.rs` 的 `artifact()` 夹具要写
# `Artifact.metadata` / `provenance` 两个 `serde_json::Value` 字段。
#
# **本 crate 的第一个 dev 依赖是 Task 2 登记的 `trybuild`（上面那一段），`serde_json` 是第二个**
# （登记＝「边由用它的那个 task 登记」，设计 §7.1；计划 Task 5 Step 1 的原话是
# 「本 task 是**它**的第一个使用点」，**「它」指 `serde_json`**）。
# **旧话照留（它错在哪）**：本行此前写「**它是本 crate 的第一个 dev 依赖使用点**」——**为假**：
# 同文件 `[dev-dependencies]` 里 `trybuild` 在它**之前**，且真的被 `tests/type_level.rs` 用
# （`trybuild::TestCases::new()`）。错因是把计划里那句的射程由「`serde_json` 的第一个使用点」
# 放大成了「本 crate 的第一个 dev 依赖使用点」（订正于 2026-10-07 的 P3-E 终审修复轮）。
# **不进 `dependency_direction.rs` 的 `ALLOWED`**：那张表逐对断言的是 **workspace 成员之间**的边
# （设计 §7.3），`serde_json` 是外部 crate。
# **但它会让 `Cargo.lock` 变化**（`continuum-node` 的依赖列表多一项），故提交时要按显式路径带上它。
# **只在测试目标里用**：`src/` 里没有一行读它（设计 §5.2 给本 crate 定的边只有 `continuum-artifact` 一条）。
serde_json = { workspace = true }
