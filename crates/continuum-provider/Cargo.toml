[package]
name = "continuum-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
continuum-core = { path = "../continuum-core" }
# Task 3 起的使用点：`tool.rs` 的 `AuthorizedToolInvocation` 要能命名
# `continuum_capability::AuthorizedTool`（§316 请求面换血，设计 §4.1 订正段）。
# **normal 边只这一条**：本 task 没有运行用例，故 `continuum-persist` / `tempfile`
# 那两条 **dev 边**由真正用它们的 Task 4 增量加。
continuum-capability = { path = "../continuum-capability" }
async-trait = { workspace = true }
serde_json = { workspace = true }
# Task 1 起的使用点：`registry.rs` 的 `RegistryError` / `ToolCallError` 派生
# `thiserror::Error`。**外部 crate 不进 `ALLOWED`**——那张表只逐对断言 workspace 成员
# 之间的边（设计 §10），故本行不产生依赖边。
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
futures-core = { workspace = true }
# Task 4 起的使用点：`tests/invoke_tool.rs` 的夹具要起一个真库、经 `Tx` 调
# `continuum_capability::authorize` 取一枚真的 `AuthorizedTool`（`authorize` 收 `&Tx<'_>`），
# 而 `invoke_tool` 的门禁正是「手里得先有那一枚」。**dev 边在这里登记**——
# 「边由用它的那个 task 加」，Task 3 时还没有用例用得上它。
# `cargo tree --edges all` 把 dev 边算进依赖，故 `dependency_direction.rs` 的 provider
# 条目**同批**补成三元素：只改一处，逐对断言即红。
continuum-persist = { path = "../continuum-persist" }
tempfile = { workspace = true }
# Task 6 起的使用点：`tests/type_level.rs` 用编译失败样例钉住工具侧的不可表达性
# （设计 §11：适配器出不了 crate、`AuthorizedToolInvocation` 在 crate 外构造不出）。
# **外部 crate 不进 `ALLOWED`**——`crates/continuum-runtime/tests/dependency_direction.rs`
# 那张表只逐对断言 workspace 成员之间的边（设计 §10），与 provider Cargo.toml 的
# `thiserror` 一条同理。新增本行会改 `Cargo.lock`，故提交时显式带上它。
trybuild = { workspace = true }
