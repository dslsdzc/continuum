[package]
name = "continuum-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# `OperatorError` 进 `ImageError::Registry` 的来源臂（Task 1）；
# `ArtifactType` 进 `Operator` 的端口字段（Task 2：`Image` 由 P5e 落地、`Blob` / `Json` 是 P1 既有）。
continuum-artifact = { path = "../continuum-artifact" }
continuum-operator = { path = "../continuum-operator" }
# `ImageError` 上派生 `Error` 与 `Display`，去掉即 `E0433`。
thiserror = { workspace = true }

[dev-dependencies]
# `tests/reuse.rs`（§3.5 的复用照片、§11.2 的 (o)、(p) 条）是本 crate 唯一的
# continuum-graph 使用点：用例经 `cache_key` / `can_reuse` 核对本块声明的
# `determinism` 真能让那条判据成立或按预期不成立。**dev 边**——生产代码对它零调用
# （`src/` 里 `continuum_graph` 零命中）；`cargo tree --edges all` 把 dev 边算进依赖，
# 故与普通边一样在 `ALLOWED` 表里登记（先例：continuum-provider 那一行的 persist）。
continuum-graph = { path = "../continuum-graph" }
# `tests/lineage.rs`（§6 的谱系照片、§11.2 的 (m)、(n) 条）是本 crate 唯一的
# continuum-persist 使用点：用例要起真库、经 `Tx` 调 `save_artifact` / `load_artifact`
# （`continuum-artifact` 只重导出这两个函数与迁移，不重导出 `Db` / `Tx`）。
# **dev 边**——生产代码对它零调用（`src/` 里 `continuum_persist` 零命中）。
# **这一条不在设计 §2.1 的边表里**（那一节逐字写着「不登记 continuum-persist：
# 本块零表，不碰 `Tx` / `Migration`」）——而 §11.2 的 (m)、(n) 两条照片要起真库，
# **两处只能有一真**；本计划的取舍与理由见计划 `## 遗留` 第一节第 1 条
# （收件人：设计作者 ＋ 协调者）。
continuum-persist = { path = "../continuum-persist" }
# 起真库用的临时目录（`tests/lineage.rs`；形状照
# `crates/continuum-artifact/tests/artifact_store.rs:109-110` 的既有先例）。
tempfile = { workspace = true }
# continuum-verify 一条 dev 边由 Task 8 增量加（设计 §2.1；计划 Global Constraints）。
