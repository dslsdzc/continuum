[workspace]
resolver = "3"
members = [
    "crates/continuum-core",
    "crates/continuum-events",
    "crates/continuum-persist",
    "crates/continuum-provider",
    "crates/continuum-artifact",
    "crates/continuum-port",
    "crates/continuum-operator",
    "crates/continuum-graph",
    "crates/continuum-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
async-trait = "0.1"
futures-core = "0.3"
thiserror = "2"
tempfile = "3"
