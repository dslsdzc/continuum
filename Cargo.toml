[workspace]
resolver = "3"
members = [
    "crates/continuum-core",
    "crates/continuum-events",
    "crates/continuum-persist",
    "crates/continuum-provider",
    "crates/continuum-artifact",
    "crates/continuum-port",
    "crates/continuum-operator",
    "crates/continuum-graph",
    "crates/continuum-runtime",
    "crates/continuum-workspace",
    "crates/continuum-sandbox",
    "crates/continuum-effect",
    "crates/continuum-policy",
    "crates/continuum-capability",
    "crates/continuum-secrets",
    "crates/continuum-connector",
    "crates/continuum-model-registry",
    "crates/continuum-node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
async-trait = "0.1"
futures-core = "0.3"
thiserror = "2"
tempfile = "3"
trybuild = "1"
landlock = "0.4"
# Task 6 起由 continuum-sandbox 用于 Landlock 的 ABI 探测：`landlock` crate 不公开
# `landlock_create_ruleset(NULL, 0, LANDLOCK_CREATE_RULESET_VERSION)` 这个入口
# （其 compat 模块是 `pub(crate)`），故须自行发该 syscall。libc 已作为 landlock 的
# 传递依赖在锁文件里（0.2.189），直接登记不引入新 crate。
libc = "0.2"
